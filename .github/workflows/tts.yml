name: Ovoz yaratish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python tools/tts/make.py
      - name: Natijani tts-out branchiga saqlash
        run: |
          cd out
          git init -q -b tts-out
          git config user.name "anfora-bot"
          git config user.email "anfora-bot@users.noreply.github.com"
          git add -A && git commit -qm "Ovoz fayllari"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" tts-out
