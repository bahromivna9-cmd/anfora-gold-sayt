name: Bot tekshiruvi

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Botni tekshirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: anfora_gold
        run: node tools/bot-check.js
