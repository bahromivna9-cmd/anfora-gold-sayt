# Telegram kanaldagi yangi postlarni har 15 daqiqada saytga qo'shadi.
name: Telegram -> sayt

on:
  schedule:
    # Soat boshidan tashqari daqiqalar — GitHub navbati kamroq
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: # Actions sahifasida "Run workflow" tugmasi bilan qo'lda ishga tushirish

permissions:
  contents: write

concurrency:
  group: telegram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Yangi postlarni olish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: anfora_gold
        continue-on-error: true
        run: node tools/sync-bot.js
      - name: Yangi postlarni olish (botsiz, ochiq sahifalardan)
        env:
          CHANNEL: anfora_gold
        run: |
          if ! command -v ffmpeg >/dev/null; then
            npm i --no-save --prefix "$RUNNER_TEMP/ff" ffmpeg-static@5
            export PATH="$(dirname "$(node -p "require('$RUNNER_TEMP/ff/node_modules/ffmpeg-static')")"):$PATH"
          fi
          node tools/sync-web.js
      - name: O'zgarishlarni saqlash
        run: |
          git config user.name "anfora-bot"
          git config user.email "anfora-bot@users.noreply.github.com"
          git add -A products.js tools images/tg
          if git diff --cached --quiet; then echo "O'zgarish yo'q"; else git commit -m "Telegram: yangi mahsulotlar" && { git push || { git pull --rebase origin main && git push; }; }; fi
